name: Sync GZW field data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/sync-data.mjs
      - .github/workflows/sync-data.yml
  schedule:
    - cron: '25 7 * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch and validate every available dataset
        run: node scripts/sync-data.mjs
      - name: Publish data changes
        run: |
          git config user.name "grayarea-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "data: sync latest GZW items"
          git push
